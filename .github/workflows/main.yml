on:
  push:
    branches:
      - blog
name: Build and deploy GH Pages
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZOLA_VERSION: 0.23.6
      PAGEFIND_VERSION: 1.5.2
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: install zola
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" zola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zola" --version
      - name: build
        run: zola build
      - name: pagefind index
        run: npx -y "pagefind@${PAGEFIND_VERSION}" --site public
      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Target branch
          publish_branch: master
          publish_dir: ./public
          force_orphan: true
