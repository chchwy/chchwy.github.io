{% for page in year_pages %}
    {% if loop.first or page.year != year_pages[loop.index0 - 1].year %}
        {% if not loop.first %}</section>{% endif %}
        <section class="year-group">
            <h2>{{ page.year }}</h2>
    {% endif %}
    <a class="post-row" href="{{ page.permalink }}">
        <span class="post-title">{{ page.title }}</span>
        <time class="post-date" datetime="{{ page.date | date(format='%Y-%m-%d') }}">{{ page.date | date(format="%m-%d") }}</time>
    </a>
    {% if loop.last %}</section>{% endif %}
{% endfor %}
