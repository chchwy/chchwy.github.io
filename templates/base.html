<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <meta name="robots" content="index, follow">
    <meta name="google-site-verification" content="CVJMtMuN_df9z9-9nvgJWUAkj4_pX3rLbm94WPkzaPE" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
    <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}">
    <meta property="og:url" content="{{ current_url | default(value=config.base_url) }}">
    <meta property="og:site_name" content="{{ config.title }}">
    <meta property="og:type" content="{% block og_type %}website{% endblock og_type %}">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{% block twitter_title %}{{ config.title }}{% endblock twitter_title %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ config.description }}{% endblock twitter_description %}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    {# The stylesheets and the CORS font files use separate connections. #}
    <link rel="preconnect" href="https://changming.yblog.org">
    <link rel="preconnect" href="https://changming.yblog.org" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap">
    <link rel="stylesheet" href="https://changming.yblog.org/fonts/1.2.1/changming.css">
    <link rel="stylesheet" href="https://changming.yblog.org/fonts/1.2.1/changming-tail.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://changming.yblog.org/fonts/1.2.1/changming-tail.css"></noscript>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ get_url(path='main.css', trailing_slash=false) }}">
</head>
<body>
    <nav aria-label="主選單">
        <a class="site-name" href="{{ get_url(path='/', trailing_slash=false) }}">Matt</a>
        <a href="{{ get_url(path='/posts/', trailing_slash=false) }}">文章列表</a>
        <a href="{{ get_url(path='/projects/', trailing_slash=false) }}">專案</a>
        <a href="{{ get_url(path='/search/', trailing_slash=false) }}">搜尋</a>
    </nav>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <span class="copyright">© {{ now() | date(format="%Y") }} Matt Chang</span>
        <div class="footer-links">
            {% if config.extra.github %}
            <a rel="noopener noreferrer" target="_blank" href="https://github.com/{{ config.extra.github | replace(from='@', to='') }}">GitHub</a>
            {% endif %}
            <a rel="noopener noreferrer" target="_blank" href="https://www.threads.com/{{ config.extra.threads }}">Threads</a>
            {% if config.generate_feeds %}
            <a rel="noopener noreferrer" target="_blank" href="{{ get_url(path=config.feed_filenames[0], trailing_slash=false) }}">RSS</a>
            {% endif %}
        </div>
    </footer>

    <!-- Inizio Codice ShinyStat -->
    <script src="//codice.shinystat.com/cgi-bin/getcod.cgi?USER=chchwy"></script>
    <noscript>
    <a href="https://www.shinystat.com/it/" target="_top">
    <img src="//www.shinystat.com/cgi-bin/shinystat.cgi?USER=chchwy" alt="Statistiche web" style="border:0px" /></a>
    </noscript>
    <!-- Fine Codice ShinyStat -->
</body>
</html>
