base_url = "https://chchwy.github.io"

# The site title and description; used in feeds by default.
title = "調和的靈感 Matt"
description = "紀錄我的思考，讀書筆記，還有程式設計"

# The default language; used in feeds.
default_language = "zh-tw"
compile_sass = false
build_search_index = false
# Posts contain code samples with {{ }} (e.g. GitHub Actions); do not render them as Tera.
skip_content_templating = ["posts/**"]
generate_feeds = true

# Taxonomies
taxonomies = [
    {name = "tags", feed = true},
    {name = "categories", feed = true}
]

[markdown]
# highlighting = "zenburn"
[markdown.highlighting]
theme = "monokai"

[extra]
# Put all your custom variables here
author = "Matt Chang"
twitter = "@chchwy"
threads = "@chchwy"
github = "chchwy"
